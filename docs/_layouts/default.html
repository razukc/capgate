<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% elsif site.description %}<meta name="description" content="{{ site.description }}">{% endif %}
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #555;
      --rule: #e3e3e3;
      --accent: #b25a00;
      --code-bg: #f6f6f4;
      --measure: 42rem;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: #fdfdfc;
      font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: var(--measure); margin: 0 auto; padding: 0 1.25rem; }
    header.site {
      border-bottom: 1px solid var(--rule);
      margin-bottom: 2.5rem;
    }
    header.site .wrap { padding-top: 1.1rem; padding-bottom: 1.1rem; }
    header.site a.brand {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.01em;
    }
    header.site a.brand:hover { color: var(--accent); }
    main .wrap { padding-bottom: 4rem; }
    h1, h2, h3 { line-height: 1.25; letter-spacing: -0.015em; font-weight: 650; }
    h1 { font-size: 1.85rem; margin: 0 0 1rem; }
    h2 { font-size: 1.35rem; margin: 2.6rem 0 0.8rem; padding-top: 0.4rem; }
    h3 { font-size: 1.1rem; margin: 1.8rem 0 0.6rem; }
    p, ul, ol, table { margin: 0 0 1.1rem; }
    a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    a:hover { text-decoration: none; }
    em { color: var(--muted); }
    hr { border: 0; border-top: 1px solid var(--rule); margin: 2.4rem 0; }
    blockquote {
      margin: 1.2rem 0;
      padding: 0.1rem 0 0.1rem 1rem;
      border-left: 3px solid var(--rule);
      color: var(--muted);
    }
    code {
      font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.86em;
      background: var(--code-bg);
      padding: 0.12em 0.34em;
      border-radius: 4px;
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.9rem 1rem;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    pre code { background: none; padding: 0; font-size: inherit; }
    table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
    th, td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
    th { font-weight: 600; border-bottom: 2px solid var(--rule); }
    footer.site {
      border-top: 1px solid var(--rule);
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    footer.site .wrap { padding-top: 1.3rem; padding-bottom: 2.5rem; }
    footer.site a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </div>
  </header>
  <main>
    <div class="wrap">
      {{ content }}
    </div>
  </main>
  <footer class="site">
    <div class="wrap">
      {{ site.description }} · <a href="https://github.com/razukc/capgate">GitHub</a> · Apache-2.0
    </div>
  </footer>
</body>
</html>
